name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  # ─── macOS 构建 (Apple Silicon + Intel 独立包) ──────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend deps
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build & bundle (arm64 - Apple Silicon)
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Build & bundle (x86_64 - Intel)
        run: bun run tauri build --target x86_64-apple-darwin --bundles dmg

      - name: Upload DMG (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload DMG (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

  # ─── Linux 构建 ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend deps
        run: bun install

      - name: Build Tauri (Linux)
        run: bun run tauri build --bundles deb appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # ─── Windows 构建 ───────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: bun install

      - name: Build Tauri (Windows)
        run: bun run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─── 创建 Tag + GitHub Release ──────────────────────────────────────────────
  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS (Apple Silicon) artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-dmg
          path: artifacts/
        continue-on-error: true

      - name: Download macOS (Intel) artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-dmg
          path: artifacts/
        continue-on-error: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/
        continue-on-error: true

      - name: Download Windows NSIS artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/
        continue-on-error: true

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/
        continue-on-error: true

      - name: Download Linux DEB
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/
        continue-on-error: true

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping"
          else
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## MagicSniffer ${{ steps.version.outputs.tag }}

            构建产物：
            - `MagicSniffer_${{ steps.version.outputs.version }}_aarch64.dmg` — macOS Apple Silicon（临时签名）
            - `MagicSniffer_${{ steps.version.outputs.version }}_x64.dmg` — macOS Intel（临时签名）
            - `MagicSniffer_${{ steps.version.outputs.version }}_x64.msi` — Windows 安装包
            - `magicsniffer_${{ steps.version.outputs.version }}_amd64.AppImage` — Linux AppImage
            - `magicsniffer_${{ steps.version.outputs.version }}_amd64.deb` — Linux DEB 包

            > macOS 使用 ad-hoc 临时签名，首次打开时如提示"无法验证开发者"，请在 Finder 中右键 App → 打开 即可运行。

            > 发布说明待补充。
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
